# Blocks all ingress. Restricts egress to HTTPS/AMQP/DNS.
# For hostname-based egress (*.servicebus.windows.net etc.) use Calico
# GlobalNetworkPolicy with FQDN matching or a dedicated egress proxy.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: consumer-network-policy
  namespace: consumer
spec:
  podSelector:
    matchLabels:
      app: consumer
  policyTypes:
    - Ingress
    - Egress
  ingress: []
  egress:
    - ports:
        - protocol: TCP
          port: 443
        - protocol: TCP
          port: 5671
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
