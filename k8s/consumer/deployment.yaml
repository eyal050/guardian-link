apiVersion: apps/v1
kind: Deployment
metadata:
  name: consumer
  namespace: consumer
  labels:
    app: consumer
    app.kubernetes.io/part-of: guardianlink
spec:
  replicas: 1
  selector:
    matchLabels:
      app: consumer
  template:
    metadata:
      labels:
        app: consumer
        azure.workload.identity/use: "true"
    spec:
      serviceAccountName: consumer-sa
      containers:
        - name: consumer
          image: ${ACR_LOGIN_SERVER}/consumer:${IMAGE_TAG}
          env:
            - name: EVENT_HUB_FQDN
              value: "${EVENT_HUB_FQDN}"
            - name: EVENT_HUB_NAME
              value: "${EVENT_HUB_NAME}"
            - name: CONSUMER_GROUP
              value: "inspector"
            - name: STORAGE_BLOB_ACCOUNT_URL
              value: "${STORAGE_BLOB_URL}"
            - name: CHECKPOINT_CONTAINER
              value: "eh-checkpoints"
            - name: STARTING_POSITION
              value: "@latest"
            - name: APPLICATIONINSIGHTS_CONNECTION_STRING
              valueFrom:
                secretKeyRef:
                  name: consumer-secrets
                  key: APPLICATIONINSIGHTS_CONNECTION_STRING
          resources:
            requests:
              cpu: "100m"
              memory: "256Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
          volumeMounts:
            - name: secrets-store
              mountPath: "/mnt/secrets-store"
              readOnly: true
      volumes:
        - name: secrets-store
          csi:
            driver: secrets-store.csi.k8s.io
            readOnly: true
            volumeAttributes:
              secretProviderClass: "consumer-secrets"
