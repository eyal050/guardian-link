apiVersion: v2
name: consumer
description: >-
  GuardianLink Event Hub inspector (the "consumer"). A long-running AKS
  workload that reads the telemetry hub via Workload Identity and pulls its
  one static secret (App Insights connection string) from Key Vault via the
  Secrets Store CSI driver.
type: application
