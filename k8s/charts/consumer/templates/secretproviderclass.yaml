apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass
metadata:
  name: {{ include "consumer.secretName" . }}
  labels:
    {{- include "consumer.labels" . | nindent 4 }}
spec:
  provider: azure
  parameters:
    usePodIdentity: "false"
    clientID: {{ required "workloadIdentity.clientId is required" .Values.workloadIdentity.clientId | quote }}
    keyvaultName: {{ required "keyVault.name is required" .Values.keyVault.name | quote }}
    tenantId: {{ required "keyVault.tenantId is required" .Values.keyVault.tenantId | quote }}
    objects: |
      array:
        - |
          objectName: {{ .Values.keyVault.secretName }}
          objectType: secret
          objectAlias: {{ .Values.keyVault.envVar }}
  secretObjects:
    - secretName: {{ include "consumer.secretName" . }}
      type: Opaque
      data:
        - objectName: {{ .Values.keyVault.envVar }}
          key: {{ .Values.keyVault.envVar }}
