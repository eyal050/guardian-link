{{- if .Values.networkPolicy.enabled -}}
# Blocks all ingress. Restricts egress to HTTPS (443, App Insights + IoT Hub
# registry over AAD), AMQP (5671), MQTT (8883, device telemetry) and DNS (53).
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "producer.fullname" . }}-network-policy
  labels:
    {{- include "producer.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "producer.selectorLabels" . | nindent 6 }}
  policyTypes:
    - Ingress
    - Egress
  ingress: []
  egress:
    - ports:
        - protocol: TCP
          port: 443
        - protocol: TCP
          port: 5671
        - protocol: TCP
          port: 8883
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
{{- end }}
