# pipelines/aks-consumer.yml
name: '$(Build.BuildId) - $(Date:yyyyMMdd) - $(Rev:r)'

# CI only: build, push and scan the consumer image. Deployment is GitOps —
# ArgoCD syncs k8s/charts/consumer from Git (see k8s/argocd/consumer-app.yaml).
# To roll out a new image, bump image.tag in k8s/charts/consumer/values-<env>.yaml.
trigger:
  branches:
    include:
      - dev
      - main
  paths:
    include:
      - apps/consumer/**
      - pipelines/aks-consumer.yml

variables:
  - name: IMAGE_REPOSITORY
    value: consumer

stages:
  - stage: build_scan
    displayName: Build, Push & Scan
    jobs:
      - job: build_scan
        displayName: Docker build, push, and Trivy scan
        pool:
          vmImage: ubuntu-latest
        variables:
          - ${{ if eq(variables['Build.SourceBranch'], 'refs/heads/dev') }}:
            - group: guardianlink-infra-outputs
          - ${{ if eq(variables['Build.SourceBranch'], 'refs/heads/main') }}:
            - group: guardianlink-infra-outputs-prod
        steps:
          - script: |
              SHORT_SHA="${BUILD_SOURCEVERSION:0:8}"
              TAG="${BUILD_BUILDNUMBER}-${SHORT_SHA}"
              echo "##vso[task.setvariable variable=IMAGE_TAG;isOutput=true]${TAG}"
              echo "IMAGE_TAG=${TAG}"
            displayName: Set image tag
            name: set_tag
            env:
              BUILD_SOURCEVERSION: $(Build.SourceVersion)
              BUILD_BUILDNUMBER: $(Build.BuildNumber)

          - task: AzureCLI@2
            displayName: Build and push to ACR
            inputs:
              azureSubscription: guardianlink-azure
              scriptType: bash
              scriptLocation: inlineScript
              inlineScript: |
                set -euo pipefail
                TAG="$(set_tag.IMAGE_TAG)"
                az acr build \
                  --registry "$(ACR_NAME)" \
                  --image "$(IMAGE_REPOSITORY):${TAG}" \
                  --image "$(IMAGE_REPOSITORY):latest" \
                  apps/consumer/

          - task: AzureCLI@2
            displayName: Trivy scan (fail on CRITICAL)
            inputs:
              azureSubscription: guardianlink-azure
              scriptType: bash
              scriptLocation: inlineScript
              inlineScript: |
                set -euo pipefail
                TAG="$(set_tag.IMAGE_TAG)"
                curl -sfL https://raw.githubusercontent.com/aquasecurity/trivy/main/contrib/install.sh \
                  | sh -s -- -b /usr/local/bin v0.61.0
                az acr login --name "$(ACR_NAME)"
                trivy image \
                  --exit-code 1 \
                  --severity CRITICAL \
                  --ignore-unfixed \
                  "$(ACR_LOGIN_SERVER)/$(IMAGE_REPOSITORY):${TAG}"
