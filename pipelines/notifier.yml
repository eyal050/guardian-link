# pipelines/notifier.yml
trigger:
  branches:
    include:
      - main
  paths:
    include:
      - apps/notifier/**
      - pipelines/notifier.yml
      - pipelines/templates/function-app.yml

variables:
  - group: guardianlink-infra-outputs
  - name: FUNCTION_APP_NAME
    value: $(FUNC_NOTIFIER_NAME)

stages:
  - template: templates/function-app.yml
    parameters:
      appDir: apps/notifier
