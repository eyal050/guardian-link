# pipelines/metrics.yml
trigger:
  branches:
    include:
      - main
  paths:
    include:
      - apps/metrics/**
      - pipelines/metrics.yml
      - pipelines/templates/function-app.yml

variables:
  - group: guardianlink-infra-outputs
  - name: FUNCTION_APP_NAME
    value: $(FUNC_METRICS_NAME)

stages:
  - template: templates/function-app.yml
    parameters:
      appDir: apps/metrics
